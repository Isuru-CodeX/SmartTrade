<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login | SmartTrade</title>
    <meta name="description" content="SmartTrade Admin Portal - Authorized access only.">
    <meta name="theme-color" content="#10171c">
    <link rel="icon" href="assets/images/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="assets/css/vendor/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/vendor/font-awesome.css">
    <link rel="stylesheet" href="assets/css/smarttrade.css">
    <link rel="stylesheet" href="assets/css/smarttrade-pages.css">

    <link rel="stylesheet" href="assets/css/admin-login.css">
</head>
<body>

<div class="admin-login-page">
    <div class="admin-login-wrap">

        <div class="admin-login-logo">
            <a href="index.html">
                <img src="assets/images/logo/logo-light.png" alt="SmartTrade">
            </a>
        </div>

        <div class="admin-login-card">
            <span class="badge-admin">
                <i class="fa-solid fa-lock-keyhole"></i> Secure Portal
            </span>
            <h2>Admin Sign In</h2>
            <p class="sub">Authorized administrators and operators only.</p>

            <div class="admin-alert" id="adminAlert" role="alert">
                <i class="fa-regular fa-circle-exclamation"></i>
                <span id="adminAlertMsg">Invalid credentials</span>
            </div>

            <form id="adminLoginForm" novalidate autocomplete="on">
                <div class="form-group-field">
                    <label for="adminEmail">Administrator Email</label>
                    <div class="input-icon-wrap">
                        <i class="fa-regular fa-envelope input-icon-left"></i>
                        <input type="email" id="adminEmail" placeholder="admin@gmail.com" required autocomplete="username" autofocus>
                    </div>
                </div>

                <div class="form-group-field">
                    <label for="adminPassword">Password</label>
                    <div class="input-icon-wrap">
                        <i class="fa-regular fa-lock input-icon-left"></i>
                        <input type="password" id="adminPassword" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="toggle-password-btn" onclick="togglePass()" aria-label="Toggle password view">
                            <i class="fa-regular fa-eye" id="passToggleIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-admin-submit" id="loginBtn">
                    <i class="fa-regular fa-arrow-right-to-bracket"></i> Sign In to Admin Panel
                </button>
            </form>
        </div>

        <div class="admin-login-footer">
            <i class="fa-regular fa-shield-check"></i>
            SmartTrade Admin Infrastructure &bull; <a href="index.html">Back to Store</a>
        </div>

    </div>
</div>

<script src="assets/js/vendor/popper.min.js"></script>
<script src="assets/js/vendor/bootstrap.min.js"></script>
<script>
    const API = 'api/admin';

    // If already logged in, redirect directly
    fetch(`${API}/me`, { credentials: 'same-origin' })
        .then(res => {
            if (res.ok) window.location.href = 'admin.html';
        })
        .catch(() => {});

    function togglePass() {
        const input = document.getElementById('adminPassword');
        const icon = document.getElementById('passToggleIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'fa-regular fa-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'fa-regular fa-eye';
        }
    }

    document.getElementById('adminLoginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const email = document.getElementById('adminEmail').value.trim();
        const password = document.getElementById('adminPassword').value;
        const btn = document.getElementById('loginBtn');
        const alert = document.getElementById('adminAlert');

        if (!email || !password) {
            document.getElementById('adminAlertMsg').textContent = 'Please enter both email and password.';
            alert.classList.add('visible');
            return;
        }

        alert.classList.remove('visible');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-regular fa-spinner fa-spin"></i> Authenticating…';

        fetch(`${API}/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ email, password })
        })
        .then(async res => {
            const data = await res.json().catch(() => ({}));
            if (res.ok && data.status === 'success') {
                window.location.href = 'admin.html';
            } else {
                document.getElementById('adminAlertMsg').textContent = data.message || 'Invalid admin credentials.';
                alert.classList.add('visible');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-regular fa-arrow-right-to-bracket"></i> Sign In to Admin Panel';
            }
        })
        .catch(err => {
            console.error(err);
            document.getElementById('adminAlertMsg').textContent = 'Unable to connect to server. Please try again.';
            alert.classList.add('visible');
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-regular fa-arrow-right-to-bracket"></i> Sign In to Admin Panel';
        });
    });
</script>
</body>
</html>
